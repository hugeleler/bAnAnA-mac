<h1>配方</h1>
<p>小香蕉没有「东风破」那套独立配方程序。等价做法：把方案根放到该端的方案目录，部署，在选单里启用。复制到另一台机器时跳过 <code>installation.yaml</code> 和 <code>build/</code>。</p>
<p>整包结构见 <a href="RimeWithSchemata.html">方案包</a>。</p>
